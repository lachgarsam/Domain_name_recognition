project_name: "DomainNameSuggester"
experiment_name: "SFTTrainer-LORA-Finetuning"

model:
  base_model_name: "google/gemma-2b"
  quantization:
    enabled: false
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"

data:
  dataset_path: "generated_data.json"
  debug_subset_size: 500       # For quick debugging
  input_key: "input"
  output_key: "output"
  suggestions_key: "suggestions"
  domain_key: "domain"
  confidence_key: "confidence"
  min_confidence_threshold: 0.50
  prompt_template: "### Input: {business_description}\n### Output: {suggestion_output}<|endoftext|>"
  test_size: 0.1

tuning:
  method: "lora"
  lora:
    r: 16
    lora_alpha: 32
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"
      - "dense"
    lora_dropout: 0.05
    bias: "none"

training:
  output_dir: "./results"
  precision: "bf16"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  learning_rate: 2e-5
  weight_decay: 0.01
  num_train_epochs: 3
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  logging_steps: 10
  save_steps: 10
  eval_steps: 50
  max_seq_length: 1024      

hpo:
  n_trials: 5                 # Total number of HPO trials
  timeout: 14400              # Timeout in seconds (4 hours)
  n_jobs: 1                   # Number of parallel trials (-1 for all CPUs)
  direction: "minimize"
  study_name: "domain-suggester-study"

  sampler:
    type: "TPE"               # Tree-structured Parzen Estimator sampler

  search_space:
    training.learning_rate:
      type: "float"
      low: 1e-6
      high: 5e-4
      log: true

    tuning.lora.r:
      type: "categorical"
      choices: [8, 16, 32, 64]

    tuning.lora.lora_alpha:
      type: "categorical"
      choices: [16, 32, 64, 128]

    tuning.prefix_tuning.num_virtual_tokens:
      type: "categorical"
      choices: [10, 20, 30, 50]